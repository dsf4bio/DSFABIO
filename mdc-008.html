:root{--bg:#0c0706;--card:#171010;--card2:#211514;--txt:#fbeee6;--sub:#c4a99d;--red:#e8341c;--orange:#ff8a1f;--gold:#ffc94a;--line:rgba(255,200,170,.1);--soc-bg:#211514}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:clip;scroll-padding-top:70px}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;line-height:1.5}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.demo{position:relative;z-index:5;background:#000;color:var(--gold);text-align:center;font-size:.74rem;font-weight:800;padding:7px 12px}
.blk{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;letter-spacing:.01em}

/* HERO con fuoco WebGL */
.hero{position:relative;height:min(92svh,760px);min-height:520px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(70% 50% at 50% 100%,#3a0d05,transparent 70%),var(--bg)}
#fire,#embers{position:absolute;left:0;bottom:0;width:100%;height:100%;pointer-events:none}
#fire{height:58%;opacity:.95;-webkit-mask-image:linear-gradient(to top,#000 70%,transparent);mask-image:linear-gradient(to top,#000 70%,transparent)}
.fallback-fire{position:absolute;left:-10%;right:-10%;bottom:-10%;height:55%;background:radial-gradient(40% 60% at 30% 100%,rgba(255,138,31,.85),transparent 70%),radial-gradient(35% 70% at 65% 100%,rgba(232,52,28,.85),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(255,201,74,.9),transparent 70%);filter:blur(18px);animation:flick 1.6s ease-in-out infinite alternate;display:none}
.nogl .fallback-fire{display:block}
@keyframes flick{to{transform:scaleY(1.08) translateY(-2%);opacity:.85}}
.hero-in{position:relative;z-index:3;text-align:center;padding:0 20px 60px;margin-top:-12vh}
.temp{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:30px;background:rgba(0,0,0,.45);border:1px solid rgba(255,201,74,.35);color:var(--gold);font-weight:800;font-size:.82rem;backdrop-filter:blur(6px)}
.temp b{font-variant-numeric:tabular-nums}
.hero h1{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:clamp(3.4rem,17vw,8rem);line-height:.85;margin:18px 0 10px;text-transform:uppercase;letter-spacing:-.01em;color:#fff;text-shadow:0 0 30px rgba(255,120,30,.55),0 0 80px rgba(232,52,28,.45)}
.hero h1 span{display:block;color:transparent;-webkit-text-stroke:2px var(--orange);text-shadow:none}
.hero p{color:var(--sub);font-weight:600;max-width:420px;margin:0 auto}
.scroll{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:3;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:6px}
.scroll i{width:2px;height:28px;background:linear-gradient(var(--orange),transparent);animation:drop 1.6s ease-in-out infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* Barra calore legata allo scroll */
.heat{position:fixed;top:0;left:0;right:0;height:4px;z-index:60;background:linear-gradient(90deg,var(--red),var(--orange),var(--gold));transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 12px var(--orange)}
@supports (animation-timeline: scroll()){.heat{animation:heat linear both;animation-timeline:scroll(root)}@keyframes heat{to{transform:scaleX(1)}}}

/* Navigazione */
.nav{position:sticky;top:0;z-index:30;background:rgba(12,7,6,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:980px;margin:0 auto;padding:0 12px}
.nav-in::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;padding:16px 14px;text-decoration:none;font-weight:800;font-size:.9rem;color:var(--sub);transition:color .3s}
.nav a.on{color:#fff}
.flame-line{position:absolute;bottom:0;left:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--orange),var(--gold));box-shadow:0 0 14px var(--orange),0 -4px 14px rgba(255,138,31,.6);transition:transform .45s cubic-bezier(.7,0,.2,1),width .45s cubic-bezier(.7,0,.2,1)}

main{max-width:980px;margin:0 auto;padding:10px 16px 30px}
.sec{padding-top:40px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec-h h2{font-family:"Archivo Black",Impact,sans-serif;font-weight:400;font-size:clamp(2rem,8vw,3.2rem);line-height:.95;text-transform:uppercase}
.sec-h h2 em{font-style:normal;color:var(--orange)}
.sec-h p{color:var(--sub);font-size:.9rem;text-align:right;max-width:46%}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.dish{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:22px;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);transition:transform .35s,border-color .35s}
.dish::before{content:"";position:absolute;left:-20%;right:-20%;bottom:-60%;height:80%;background:radial-gradient(50% 50% at 50% 100%,rgba(255,110,30,.4),transparent 70%);opacity:0;transform:translateY(30%);transition:opacity .45s,transform .45s;pointer-events:none}
.dish:hover{transform:translateY(-4px);border-color:rgba(255,138,31,.45)}
.dish:hover::before{opacity:1;transform:none}
.dish .top{display:flex;align-items:flex-start;gap:12px}
.dish .ico{flex:0 0 54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.9rem;background:radial-gradient(circle at 50% 80%,rgba(255,138,31,.35),rgba(255,255,255,.04));border:1px solid var(--line)}
.dish h3{font-size:1.08rem;font-weight:800;line-height:1.25}
.dish p{color:var(--sub);font-size:.9rem}
.dish .bot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:auto;padding-top:6px}
.price{font-family:"Archivo Black",sans-serif;font-size:1.3rem;color:var(--gold);white-space:nowrap}
.tag{display:inline-block;font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:20px;margin-top:4px;margin-right:4px}
.tag.hot{background:rgba(232,52,28,.2);color:#ff7a62}.tag.veg{background:rgba(120,200,90,.15);color:#9de07f}.tag.top{background:rgba(255,201,74,.16);color:var(--gold)}
.als{display:flex;flex-wrap:wrap;gap:4px}
.al{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.07);display:inline-grid;place-items:center;font-size:.72rem}
.none{font-size:.72rem;color:var(--sub)}
.oven{margin-top:40px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;padding:22px;border-radius:24px;background:radial-gradient(80% 120% at 0% 100%,rgba(232,52,28,.35),transparent 60%),var(--card);border:1px solid var(--line)}
.oven .num{font-family:"Archivo Black",sans-serif;font-size:clamp(2.6rem,10vw,4rem);line-height:1;color:var(--gold);text-shadow:0 0 30px rgba(255,138,31,.6)}
.oven p{color:var(--sub)}
.oven b{color:#fff}
.legend{margin-top:30px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.legend h2{font-family:"Archivo Black",sans-serif;font-weight:400;font-size:1.3rem;text-transform:uppercase;margin-bottom:10px}
.legend ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;font-size:.86rem}
.legend li{display:flex;gap:8px;align-items:center}
.legend p{font-size:.8rem;color:var(--sub);margin-top:10px}
footer{text-align:center;padding:34px 18px;color:var(--sub);font-size:.9rem}
footer strong{font-family:"Archivo Black",sans-serif;font-weight:400;font-size:1.8rem;text-transform:uppercase;color:#fff;display:block}
.rv{opacity:0;transform:translateY(30px) scale(.98);transition:opacity .7s cubic-bezier(.2,.9,.2,1),transform .7s cubic-bezier(.2,.9,.2,1);transition-delay:calc(var(--d,0) * 70ms)}
.rv.in{opacity:1;transform:none}
@media (max-width:640px){.grid{grid-template-columns:1fr}.sec-h{flex-direction:column;align-items:flex-start}.sec-h p{text-align:left;max-width:none}.oven{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}#embers{display:none}}
.soc{display:flex;justify-content:center;gap:12px;margin:18px 0 6px}
.soc a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--soc-bg,#222);color:var(--soc-fg,#fff);transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s;text-decoration:none}

.soc a.fb{background:#1877F2;color:#fff}.soc a.wa{background:#25D366;color:#fff}
.soc a.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%);color:#fff}
.soc svg{width:23px;height:23px}
.flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-top:10px;font-size:.85rem}
.flinks a{text-decoration:underline;text-underline-offset:3px;color:inherit;opacity:.85}
</style>

  var heat = $('.heat'); addEventListener('scroll', function () { var h = document.documentElement.scrollHeight - innerHeight; heat.style.transform = 'scaleX(' + (h > 0 ? scrollY / h : 0) + ')'; }, {passive: true});
}

/* Termometro del forno */
(function () {
  var el = $('#deg'), target = 485;
  if (reduced) { el.textContent = target; return; }
  var t0 = performance.now();
  (function tick(t) { var k = Math.min((t - t0) / 1800, 1); el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(tick); })(t0);
})();

/* ---------- Fuoco in WebGL (shader con rumore frattale) ---------- */
var hero = $('.hero'), visible = true;
new IntersectionObserver(function (es) { visible = es[0].isIntersecting; }).observe(hero);
function startFire() {
  var c = $('#fire'), gl = c.getContext('webgl', {premultipliedAlpha: false, antialias: false, alpha: true});
  if (!gl || reduced) { document.documentElement.classList.add('nogl'); c.remove(); return; }
  var vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  var fs = [
    'precision mediump float;uniform vec2 r;uniform float t;',
    'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
    'float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}',
    'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}',
    'void main(){vec2 uv=gl_FragCoord.xy/r;float ar=r.x/r.y;vec2 q=vec2(uv.x*ar,uv.y);',
    'float f1=fbm(vec2(q.x*2.6,q.y*1.4-t*1.1));float f2=fbm(vec2(q.x*5.+f1*1.6,q.y*2.6-t*2.3));',
    'float tongues=.55+.45*sin(q.x*9.+f1*4.+t*.8);',
    'float base=pow(1.-uv.y,1.3);float fl=base*(.55+.6*tongues)+f2*1.05-.78;fl=clamp(fl*1.35,0.,1.);fl*=smoothstep(0.,.1,uv.x)*smoothstep(1.,.9,uv.x);',
    'vec3 c=mix(vec3(.18,.01,0.),vec3(.85,.12,.02),smoothstep(.02,.3,fl));c=mix(c,vec3(1.,.42,.05),smoothstep(.3,.6,fl));c=mix(c,vec3(1.,.66,.18),smoothstep(.55,.85,fl));c=mix(c,vec3(1.,.85,.45),smoothstep(.9,1.,fl));',
    'gl_FragColor=vec4(c,smoothstep(.0,.3,fl));}'
  ].join('\n');
  function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  var pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { document.documentElement.classList.add('nogl'); c.remove(); return; }
  gl.useProgram(pr);
  var b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  var lp = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp, 2, gl.FLOAT, false, 0, 0);
  var ur = gl.getUniformLocation(pr, 'r'), ut = gl.getUniformLocation(pr, 't');
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  var scale = innerWidth < 700 ? .45 : .6; /* risoluzione ridotta: leggero anche sui telefoni */
  function size() { c.width = Math.max(2, c.clientWidth * scale | 0); c.height = Math.max(2, c.clientHeight * scale | 0); gl.viewport(0, 0, c.width, c.height); }
  size(); addEventListener('resize', size);
  var t0 = performance.now();
  (function loop(t) { requestAnimationFrame(loop); if (!visible || document.hidden) return; gl.uniform2f(ur, c.width, c.height); gl.uniform1f(ut, (t - t0) / 1000); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); })(t0);
}
/* ---------- Braci che salgono (canvas 2D) ---------- */
function startEmbers() {
  if (reduced) return;
  var c = $('#embers'), x = c.getContext('2d'), P = [], N = innerWidth < 700 ? 40 : 70, w, h, dpr = Math.min(devicePixelRatio || 1, 1.5);
  function size() { w = c.clientWidth; h = c.clientHeight; c.width = w * dpr; c.height = h * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function sp(p) { p = p || {}; p.x = Math.random() * w; p.y = h + Math.random() * 40; p.vy = .6 + Math.random() * 1.6; p.vx = (Math.random() - .5) * .5; p.r = .8 + Math.random() * 2.2; p.l = 0; p.m = 140 + Math.random() * 160; p.s = Math.random() * 10; return p; }
  size(); addEventListener('resize', size);
  for (var i = 0; i < N; i++) { var p = sp(); p.y = Math.random() * h; p.l = Math.random() * p.m; P.push(p); }
  (function loop() {
    requestAnimationFrame(loop); if (!visible || document.hidden) return;
    x.clearRect(0, 0, w, h); x.globalCompositeOperation = 'lighter';
    P.forEach(function (p) {
      p.l++; p.y -= p.vy; p.x += p.vx + Math.sin((p.l + p.s * 30) * .04) * .6;
      if (p.l > p.m || p.y < -10) sp(p);
      var a = Math.max(0, 1 - p.l / p.m), g = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      g.addColorStop(0, 'rgba(255,220,140,' + a + ')'); g.addColorStop(.4, 'rgba(255,120,30,' + a * .6 + ')'); g.addColorStop(1, 'rgba(255,60,0,0)');
      x.fillStyle = g; x.beginPath(); x.arc(p.x, p.y, p.r * 4, 0, 6.283); x.fill();
    });
  })();
}
startFire(); startEmbers();
})();
