<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0d0a1f">
<title>Sakura Neon · Modello di menu digitale (esempio) | DSFabio Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;600;800&display=swap">
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--bg:#0d0a1f;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--txt:#f4f1ff;--sub:#b7b0d6;--pink:#ff3cac;--violet:#7b5cff;--cyan:#22d3ee;--lime:#b4ff39;--amber:#ffcf3f;
  --grad:linear-gradient(120deg,var(--pink),var(--violet),var(--cyan));
  --grad-loop:linear-gradient(120deg,var(--pink),var(--violet),var(--cyan),var(--pink));
  --tab-h:72px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,-apple-system,sans-serif;line-height:1.5;overflow-x:clip;padding-bottom:calc(var(--tab-h) + 30px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
.demo-bar{position:relative;z-index:5;background:#000;color:var(--amber);text-align:center;font-size:.75rem;font-weight:800;letter-spacing:.04em;padding:6px 10px}

/* ---------- Sfondo aurora animato ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(80% 60% at 50% 0%,#1f1350,transparent 70%),var(--bg)}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.42;will-change:transform;animation:drift 22s ease-in-out infinite alternate}
.bg .b1{background:var(--pink);top:-22vmax;left:-22vmax}
.bg .b2{background:var(--violet);top:20vh;right:-28vmax;animation-duration:28s;animation-delay:-6s}
.bg .b3{background:var(--cyan);bottom:-28vmax;left:5vw;animation-duration:32s;animation-delay:-12s;opacity:.28}
@keyframes drift{to{transform:translate(12vw,10vh) scale(1.15)}}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:linear-gradient(#000,transparent 70%);mask-image:linear-gradient(#000,transparent 70%)}

/* Barra di avanzamento dello scroll (CSS scroll-driven) */
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:var(--grad);transform-origin:0 50%;transform:scaleX(0)}
@supports (animation-timeline: scroll()){
  .progress{animation:prog linear both;animation-timeline:scroll(root)}
  @keyframes prog{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}

/* ---------- Header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 8px;max-width:900px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;flex:0 0 auto;border-radius:16px;display:grid;place-items:center;font-size:1.5rem;font-weight:800;background:var(--grad);box-shadow:0 8px 24px rgba(255,60,172,.35)}
h1{font-family:Syne,sans-serif;font-size:1.7rem;line-height:1.05}
.grad-text{background:linear-gradient(90deg,#fff,var(--pink),var(--cyan),#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 8s linear infinite}
@keyframes sheen{to{background-position:300% 0}}
.tagline{font-size:.82rem;color:var(--sub)}
.btn-neon{flex:0 0 auto;border:2px solid transparent;border-radius:999px;padding:9px 16px;font-weight:800;font-size:.85rem;background:linear-gradient(var(--bg),var(--bg)) padding-box,conic-gradient(from var(--ang),var(--pink),var(--violet),var(--cyan),var(--lime),var(--pink)) border-box;animation:rot 4s linear infinite}
@keyframes rot{to{--ang:360deg}}

/* ---------- Striscia scorrevole ---------- */
.marquee{overflow:hidden;border-block:1px solid var(--line);margin:12px 0 6px;background:rgba(255,255,255,.03);transform:rotate(-2deg) scale(1.06)}
.mq{display:flex;width:max-content;animation:mq 24s linear infinite}
.mq span{padding:10px 0;font-family:Syne,sans-serif;font-weight:800;letter-spacing:.08em;white-space:nowrap;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- Pagina categoria ---------- */
.hero{max-width:900px;margin:0 auto;padding:22px 18px 4px;display:flex;align-items:center;gap:16px}
.hero-emoji{font-size:clamp(4rem,22vw,7rem);line-height:1;filter:drop-shadow(0 12px 30px rgba(123,92,255,.55))}
.hero-emoji span{display:inline-block;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(-6deg)}}
.hero h2{font-family:Syne,sans-serif;font-size:clamp(2.2rem,11vw,4rem);line-height:.95;text-transform:uppercase}
.hero p{color:var(--sub);font-size:.88rem;margin-top:6px}
.swipe{display:inline-block;margin-top:6px;font-size:.72rem;color:var(--cyan);letter-spacing:.06em}

.grid{max-width:900px;margin:0 auto;padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;perspective:900px}
.card-in{position:relative;height:100%;padding:16px;border-radius:24px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,border-color .3s;display:flex;gap:14px;align-items:flex-start;overflow:hidden}
.card-in::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.14),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover .card-in::before{opacity:1}
.card:hover .card-in{border-color:rgba(255,255,255,.25)}
.orb{flex:0 0 auto;width:72px;height:72px;border-radius:22px;display:grid;place-items:center;font-size:2.4rem;background:linear-gradient(140deg,hsl(var(--h) 90% 62%),hsl(calc(var(--h) + 60) 90% 55%));box-shadow:0 10px 26px hsl(var(--h) 90% 50% / .45),inset 0 2px 0 rgba(255,255,255,.35)}
.orb span{display:inline-block;animation:float 3.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.6s)}
.c-body{flex:1;min-width:0}
.c-body h3{font-family:Syne,sans-serif;font-size:1.08rem;line-height:1.2}
.c-body p{font-size:.84rem;color:var(--sub);margin:5px 0 8px}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.price{font-family:Syne,sans-serif;font-weight:800;font-size:1.1rem}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.top{background:rgba(255,207,63,.18);color:var(--amber)}
.tag.hot{background:rgba(255,60,172,.18);color:#ff8fcf}
.tag.veg{background:rgba(180,255,57,.15);color:var(--lime)}
.tag.new{background:rgba(34,211,238,.15);color:var(--cyan)}
.als{display:flex;flex-wrap:wrap;gap:4px}
.al{width:24px;height:24px;border-radius:8px;display:inline-grid;place-items:center;font-size:.78rem;background:rgba(255,255,255,.08)}
.al-none{font-size:.72rem;color:var(--sub)}

/* Pulsante Aggiungi con gradiente e onda */
.add{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;font-weight:800;font-size:.85rem;color:#0d0a1f;background:var(--grad-loop);background-size:300% 100%;transition:background-position .5s,transform .15s;box-shadow:0 6px 18px rgba(255,60,172,.35)}
.add:hover{background-position:100% 0}
.add:active{transform:scale(.92)}
.add .q{background:#0d0a1f;color:#fff;border-radius:999px;padding:0 7px;font-size:.72rem}
.add .q:empty{display:none}
.ripple{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:rgba(255,255,255,.7);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(9);opacity:0}}

/* Comparsa delle card legata allo scroll (CSS scroll-driven) */
@supports (animation-timeline: view()){
  .card{animation:rise linear both;animation-timeline:view();animation-range:entry 5% cover 30%}
}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.92) rotateX(18deg)}to{opacity:1;transform:none}}
/* Alternativa per browser senza scroll-driven animations */
.io .card{opacity:0;transform:translateY(40px);transition:opacity .7s,transform .7s cubic-bezier(.2,.9,.2,1);transition-delay:calc(var(--i) * 70ms)}
.io .card.in{opacity:1;transform:none}

/* ---------- Legenda / footer / CTA ---------- */
.legend{max-width:900px;margin:26px auto 0;padding:0 18px}
.legend-box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.legend h2{font-family:Syne,sans-serif;font-size:1.2rem;margin-bottom:12px}
.legend ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 12px;font-size:.85rem}
.legend li{display:flex;align-items:center;gap:8px}
.legend p{font-size:.78rem;color:var(--sub);margin-top:12px}
footer{text-align:center;padding:30px 18px 10px;color:var(--sub);font-size:.85rem}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.links a{text-decoration:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-weight:700;font-size:.82rem}
.cta{max-width:560px;margin:24px 18px 0;margin-inline:auto;text-align:center;padding:28px 20px;border-radius:28px;background:linear-gradient(160deg,rgba(255,60,172,.16),rgba(34,211,238,.1));border:1px solid var(--line)}
.cta h2{font-family:Syne,sans-serif;font-size:1.6rem;line-height:1.1}
.cta p{color:var(--sub);margin:8px 0 18px}
.cta-btn{display:inline-block;padding:14px 24px;border-radius:999px;font-weight:800;text-decoration:none;color:#0d0a1f;background:var(--grad-loop);background-size:300% 100%;animation:sheen 6s linear infinite;box-shadow:0 10px 30px rgba(255,60,172,.4)}
.back{display:block;margin-top:16px;color:var(--cyan);font-weight:800;text-decoration:none}

/* ---------- Barra categorie in basso ---------- */
.tabbar{position:fixed;z-index:40;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100% - 20px));height:var(--tab-h);display:grid;grid-template-columns:repeat(4,1fr);padding:8px;border-radius:26px;background:rgba(20,15,45,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);view-transition-name:tabbar}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:18px;font-size:.72rem;font-weight:800;color:var(--sub);transition:color .3s}
.tab .ti{font-size:1.4rem;line-height:1.1;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.tab[aria-current="page"]{color:#fff}
.tab[aria-current="page"] .ti{transform:translateY(-3px) scale(1.18)}
.ind{position:absolute;z-index:0;top:8px;bottom:8px;left:8px;width:calc((100% - 16px) / 4);border-radius:18px;background:var(--grad);box-shadow:0 8px 24px rgba(123,92,255,.5);transform:translateX(calc(var(--idx,0) * 100%));transition:transform .55s cubic-bezier(.6,-.25,.2,1.3)}

renderAll();
})();
</script>
</body>
</html>
