<!-- MODULO RICHIESTA ASSISTENZA – DS Fabio -->
<div id="dsf-assistenza">
  <style>
    #dsf-assistenza {
      /* ---- colori: cambiali qui per uniformarli al sito ---- */
      --dsf-accent: #7c5cff;        /* pulsanti, bordi attivi */
      --dsf-accent-text: #ffffff;   /* testo sui pulsanti */
      --dsf-field-bg: rgba(127, 127, 127, 0.08);
      --dsf-border: rgba(127, 127, 127, 0.35);
      --dsf-error: #e5484d;
      --dsf-ok: #2fb66d;
      /* ----------------------------------------------------- */
      font: inherit;
      color: inherit;
      max-width: 640px;
      margin: 0 auto;
      box-sizing: border-box;
      text-align: left;
    }
    #dsf-assistenza *, #dsf-assistenza *::before, #dsf-assistenza *::after { box-sizing: border-box; }
    #dsf-assistenza label, #dsf-assistenza legend, #dsf-assistenza .dsf-label, #dsf-assistenza .dsf-choice,
    #dsf-assistenza .dsf-drop, #dsf-assistenza .dsf-consent, #dsf-assistenza .dsf-file {
      color: inherit; text-transform: none; letter-spacing: normal;
    }
    #dsf-assistenza ul, #dsf-assistenza li { list-style: none; }
    #dsf-assistenza .dsf-field { margin: 0 0 18px; }
    #dsf-assistenza .dsf-label { display: block; font-weight: 600; margin: 0 0 6px; font-size: 0.95em; }
    #dsf-assistenza .dsf-hint { font-size: 0.82em; opacity: 0.7; margin-top: 4px; }
    #dsf-assistenza .dsf-input,
    #dsf-assistenza .dsf-textarea {
      display: block; width: 100%; margin: 0; padding: 12px 14px;
      font: inherit; color: inherit; background: var(--dsf-field-bg);
      border: 1px solid var(--dsf-border); border-radius: 10px; outline: none;
      -webkit-appearance: none; appearance: none;
    }
    #dsf-assistenza .dsf-textarea { min-height: 120px; resize: vertical; }
    #dsf-assistenza .dsf-input:focus,
    #dsf-assistenza .dsf-textarea:focus { border-color: var(--dsf-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dsf-accent) 25%, transparent); }
    #dsf-assistenza .dsf-code { max-width: 260px; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; font-size: 1.15em; letter-spacing: 0.12em; text-transform: uppercase; }
    #dsf-assistenza .dsf-choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; border: 0; padding: 0; margin: 0; }
    #dsf-assistenza .dsf-choice {
      display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 10px 14px; margin: 0;
      border: 1px solid var(--dsf-border); border-radius: 10px; cursor: pointer; background: var(--dsf-field-bg);
      font-weight: 500;
    }
    #dsf-assistenza .dsf-choice input { width: 18px; height: 18px; margin: 0; accent-color: var(--dsf-accent); flex: none; }
    #dsf-assistenza .dsf-choice.is-on { border-color: var(--dsf-accent); box-shadow: inset 0 0 0 1px var(--dsf-accent); }
    #dsf-assistenza .dsf-drop {
      display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 18px; text-align: center;
      border: 1.5px dashed var(--dsf-border); border-radius: 12px; cursor: pointer; background: var(--dsf-field-bg);
    }
    #dsf-assistenza .dsf-drop:hover, #dsf-assistenza .dsf-drop.is-over { border-color: var(--dsf-accent); }
    #dsf-assistenza .dsf-drop strong { font-weight: 600; }
    #dsf-assistenza .dsf-drop span { font-size: 0.82em; opacity: 0.7; }
    #dsf-assistenza .dsf-hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
    #dsf-assistenza .dsf-files { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
    #dsf-assistenza .dsf-file { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--dsf-border); border-radius: 8px; font-size: 0.9em; }
    #dsf-assistenza .dsf-file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #dsf-assistenza .dsf-file button { background: none; border: 0; color: inherit; font-size: 1.3em; line-height: 1; cursor: pointer; padding: 0 4px; opacity: 0.7; }
    #dsf-assistenza .dsf-consent { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 20px; cursor: pointer; font-size: 0.92em; }
    #dsf-assistenza .dsf-consent input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--dsf-accent); flex: none; }
    #dsf-assistenza .dsf-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 52px;
      padding: 0 20px; border: 0; border-radius: 12px; cursor: pointer;
      background: var(--dsf-accent); color: var(--dsf-accent-text); font: inherit; font-weight: 700; font-size: 1.05em;
    }
    #dsf-assistenza .dsf-btn:disabled { opacity: 0.6; cursor: wait; }
    #dsf-assistenza .dsf-btn-ghost { background: transparent; color: inherit; border: 1px solid var(--dsf-border); width: auto; min-height: 44px; font-size: 1em; }
    #dsf-assistenza .dsf-spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: dsf-spin .7s linear infinite; }
    @keyframes dsf-spin { to { transform: rotate(360deg); } }
    #dsf-assistenza .dsf-error { background: color-mix(in srgb, var(--dsf-error) 14%, transparent); border: 1px solid color-mix(in srgb, var(--dsf-error) 45%, transparent); border-radius: 10px; padding: 12px 14px; margin: 0 0 18px; }
    #dsf-assistenza .dsf-success { text-align: center; padding: 32px 12px; }
    #dsf-assistenza .dsf-success-icon { width: 60px; height: 60px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 700; color: var(--dsf-ok); background: color-mix(in srgb, var(--dsf-ok) 15%, transparent); }
    #dsf-assistenza .dsf-success h3 { margin: 0 0 8px; font-size: 1.3em; }
    #dsf-assistenza .dsf-success p { margin: 0 0 20px; opacity: 0.85; }
    #dsf-assistenza .dsf-trap { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    #dsf-assistenza [hidden] { display: none !important; }
    @media (max-width: 560px) { #dsf-assistenza .dsf-choices { grid-template-columns: 1fr; } }
  </style>

  <form id="dsf-form" novalidate>
    <div id="dsf-error" role="alert"></div>

    <div class="dsf-field">
      <label class="dsf-label" for="dsf-code">Codice cliente *</label>
      <input class="dsf-input dsf-code" id="dsf-code" name="client_code" maxlength="10" placeholder="DS0000"
             autocomplete="off" autocapitalize="characters" spellcheck="false" required>
      <div class="dsf-hint">Lo trovi sulla scheda cliente che ti abbiamo consegnato (es. DS4827).</div>
    </div>

    <fieldset class="dsf-field" style="border:0;padding:0;margin:0 0 18px">
      <legend class="dsf-label">Cosa vuoi fare? * <span style="font-weight:400;opacity:.7">(puoi sceglierne più di uno)</span></legend>
      <div class="dsf-choices">
        <label class="dsf-choice"><input type="checkbox" name="request_types" value="aggiunta_piatto"> ➕ Aggiunta piatto</label>
        <label class="dsf-choice"><input type="checkbox" name="request_types" value="modifica_piatto"> ✏️ Modifica
