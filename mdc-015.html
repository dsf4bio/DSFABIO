<style>
:root{--wood:#5a3720;--wood2:#7a4c2c;--paper:#f6ecd6;--paper2:#efe1c3;--ink:#3a2617;--sub:#7a5f47;--red:#a8322a;--green:#4f6b3a;--chalk:#2c3330;
--pm-bg:#f6ecd6;--pm-ink:#3a2617;--pm-sub:#7a5f47;--pm-accent:#a8322a;--pm-accent-ink:#fff;--pm-head:Caveat,cursive;--pm-line:#d9c49c;--pm-radius:18px;--pm-art:radial-gradient(70% 70% at 50% 45%,#fff6e2,#e3cfa6)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{font-family:Lora,Georgia,serif;color:var(--ink);line-height:1.5;overflow-x:clip;background:#3b2414;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 120px),repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 7px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid #f2c14e;outline-offset:3px;border-radius:8px}
.demo{background:#f2c14e;color:#3a2617;text-align:center;font-family:system-ui,sans-serif;font-size:.74rem;font-weight:800;padding:7px 12px}
.hand{font-family:Caveat,cursive}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* Testata: asse di legno + camino */
.top{position:relative;padding:30px 0 10px;text-align:center;color:#f6ecd6}
.plank{position:relative;display:inline-block;padding:18px 34px 14px;border-radius:14px;background:linear-gradient(180deg,var(--wood2),var(--wood));box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.12),inset 0 -4px 0 rgba(0,0,0,.25);background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 2px,transparent 2px 9px),linear-gradient(180deg,var(--wood2),var(--wood))}
.plank::before,.plank::after{content:"";position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#2a1a0e;box-shadow:inset 1px 1px 0 rgba(255,255,255,.2)}
.plank::before{left:12px}.plank::after{right:12px}
.plank small{display:block;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:#f2c14e}
.plank h1{font-family:Caveat,cursive;font-weight:700;font-size:clamp(3rem,12vw,4.6rem);line-height:.9;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.fire{position:relative;width:120px;height:90px;margin:18px auto 0}
.fire .log{position:absolute;bottom:0;width:80px;height:16px;border-radius:8px;background:#6b3f1f;left:20px}
.fire .log.b{transform:rotate(-14deg);left:14px}.fire .log.c{transform:rotate(14deg);left:26px}
.flame{position:absolute;bottom:10px;left:50%;width:44px;height:64px;margin-left:-22px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 75%,#fff3b0,#ffb627 35%,#ff6a1a 65%,transparent 70%);filter:blur(1px);transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite alternate}
.flame.f2{width:30px;height:46px;margin-left:-34px;animation-duration:.8s}
.flame.f3{width:30px;height:50px;margin-left:4px;animation-duration:.95s;animation-delay:-.3s}
@keyframes flick{0%{transform:scale(1,1) rotate(-3deg)}50%{transform:scale(1.08,.92) rotate(3deg)}100%{transform:scale(.95,1.1) rotate(-2deg)}}
.spark{position:absolute;bottom:50px;left:50%;width:4px;height:4px;border-radius:50%;background:#ffcf5a;animation:spark 2.2s linear infinite}
@keyframes spark{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--x),-80px);opacity:0}}
.since{font-family:Caveat,cursive;font-size:1.3rem;color:#f2c14e;margin-top:6px}

/* Lavagnette appese */
.rope{position:sticky;top:0;z-index:20;padding:6px 0 0;background:linear-gradient(#3b2414 70%,rgba(59,36,20,0))}
.rope-line{position:absolute;left:0;right:0;top:16px;height:4px;background:repeating-linear-gradient(45deg,#c9a46a 0 4px,#8c6a3a 4px 8px);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.signs{position:relative;display:flex;justify-content:center;gap:10px;padding:0 10px 22px;overflow-x:auto;scrollbar-width:none}
.signs::-webkit-scrollbar{display:none}
.sign{position:relative;flex:0 0 auto;padding-top:34px;transform-origin:50% 16px;animation:swing 4s ease-in-out infinite;transition:padding .5s cubic-bezier(.3,1.5,.5,1)}
.sign:nth-child(2){animation-delay:-1s}.sign:nth-child(3){animation-delay:-2s}.sign:nth-child(4){animation-delay:-3s}.sign:nth-child(5){animation-delay:-1.5s}
@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.sign::before,.sign::after{content:"";position:absolute;top:16px;width:2px;height:24px;background:#c9a46a}
.sign::before{left:28%;transform:rotate(14deg)}.sign::after{right:28%;transform:rotate(-14deg)}
.sign span{display:block;padding:10px 16px 8px;min-width:96px;border-radius:8px;background:var(--chalk);border:5px solid #9a6a3c;color:#f1efe6;font-family:Caveat,cursive;font-size:1.45rem;font-weight:700;line-height:1;text-align:center;box-shadow:0 10px 18px rgba(0,0,0,.4);background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:6px 6px}
.sign span i{display:block;font-style:normal;font-size:1.3rem;margin-bottom:2px}
.sign[aria-pressed="true"]{padding-top:52px;animation:swing2 .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes swing2{0%{transform:rotate(14deg)}40%{transform:rotate(-8deg)}70%{transform:rotate(4deg)}100%{transform:rotate(0)}}
.sign[aria-pressed="true"] span{background-color:#a8322a;border-color:#c9a46a}
.sign[aria-pressed="true"]::before,.sign[aria-pressed="true"]::after{height:42px}

/* Foglio del menu che si sfoglia */
.book{perspective:1600px;padding-bottom:40px}
.page{position:relative;background:var(--paper);border-radius:6px 14px 14px 6px;padding:28px 22px 30px 30px;box-shadow:0 30px 60px rgba(0,0,0,.45),inset 18px 0 24px -16px rgba(0,0,0,.25);background-image:linear-gradient(90deg,transparent 22px,rgba(168,50,42,.25) 22px 24px,transparent 24px),repeating-linear-gradient(0deg,transparent 0 33px,rgba(90,55,32,.09) 33px 34px);transform-origin:0 50%}
.page.turn{animation:turn .75s cubic-bezier(.4,.1,.3,1)}
@keyframes turn{0%{transform:rotateY(0)}45%{transform:rotateY(-88deg);filter:brightness(.7)}46%{transform:rotateY(88deg)}100%{transform:rotateY(0)}}
.page h2{font-family:Caveat,cursive;font-size:clamp(2.4rem,8vw,3.2rem);line-height:1;color:var(--red)}
.page .sub{color:var(--sub);font-style:italic;font-size:.95rem;margin:2px 0 18px}
.dish{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 6px;border-radius:14px;transition:background .3s,transform .3s}
.dish:hover{background:rgba(168,50,42,.07);transform:translateX(4px)}
.dish .plate{flex:0 0 76px;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#fff8e8,#e9d6ae);box-shadow:inset 0 0 0 3px #c98a4a,0 6px 14px rgba(90,55,32,.25)}
.dish .plate .pa{width:86%}
.dish .tx{flex:1;min-width:0}
.dish .line{display:flex;align-items:baseline;gap:8px}
.dish b{font-family:Caveat,cursive;font-size:1.6rem;line-height:1.05;font-weight:700}
.dish .dots{flex:1;border-bottom:2px dotted rgba(90,55,32,.45);transform:translateY(-5px);min-width:20px}
.dish .pr{white-space:nowrap;font-family:Caveat,cursive;font-size:1.55rem;font-weight:700;color:var(--red)}
.dish p{font-size:.88rem;color:var(--sub);line-height:1.35;margin-top:2px}
.dish .al{font-size:.82rem;margin-top:3px;letter-spacing:2px}
.nonna{display:inline-block;margin-left:6px;font-family:Caveat,cursive;font-size:1rem;color:#fff;background:var(--green);padding:0 8px;border-radius:6px;transform:rotate(-3deg)}
.stamp{position:absolute;right:16px;top:16px;width:84px;height:84px;border-radius:50%;border:3px solid rgba(168,50,42,.6);color:rgba(168,50,42,.7);display:grid;place-items:center;text-align:center;font-family:Caveat,cursive;font-weight:700;font-size:1rem;line-height:1;transform:rotate(14deg)}
.foot{text-align:center;color:#e7d4b0;font-size:.85rem;padding:0 16px 34px}
.foot b{font-family:Caveat,cursive;font-size:1.3rem;color:#f2c14e}
@media (max-width:520px){.dish .plate{flex-basis:64px;width:64px;height:64px}.stamp{width:58px;height:58px;font-size:.78rem;right:8px;top:8px;opacity:.7}.page .sub{padding-right:56px}.page{padding:24px 14px 24px 30px}}
@media (prefers-reduced-motion:reduce){.sign,.flame,.spark{animation:none}.page.turn{animation:none}}
</style>
</head>
<body>
<div class="demo">MODELLO DIMOSTRATIVO · piatti, prezzi e dati sono di fantasia</div>
<header class="top">
<div class="plank"><small>Trattoria · cucina di casa</small><h1>Il Focolare</h1></div>
<div class="fire" aria-hidden="true"><span class="log"></span><span class="log b"></span><span class="log c"></span><span class="flame f2"></span><span class="flame"></span><span class="flame f3"></span><span class="spark" style="--x:-20px"></span><span class="spark" style="--x:16px;animation-delay:.7s"></span><span class="spark" style="--x:-6px;animation-delay:1.4s"></span></div>
<p class="since">dal 1962 · brace accesa tutti i giorni</p>
</header>

<nav class="rope" aria-label="Categorie del menu"><div class="rope-line"></div><div class="signs" id="signs"></div></nav>

<main class="wrap book"><article class="page" id="page" aria-live="polite"></article></main>
<p class="foot"><b>Il Focolare</b><br>Via del Borgo 4 · Brisighella (RA) · Pane e coperto 2,50 €</p>

<script src="assets/piatti.js"></script>
<script>
(function () {
'use strict';
var M = [
  {n:'Antipasti', ic:'🧀', s:'Per cominciare, da dividere al centro del tavolo', items:[
    {n:'Tagliere del contadino', d:'Salumi di mora romagnola, squacquerone, piadina calda e confettura di fichi.', p:'15 €', art:'tagliere', al:['glutine','latte'], tags:['Per 2 persone']},
    {n:'Crocchette della nonna', d:'Patate, formaggio di fossa e prezzemolo, fritte al momento.', p:'7 €', art:'fritti', o:{round:true,in:'#f1d27a'}, al:['glutine','uova','latte'], nonna:true}
  ]},
  {n:'Primi', ic:'🍝', s:'Sfoglia tirata a mano col mattarello', items:[
    {n:'Tagliatelle al ragù', d:'Ragù di manzo e maiale cotto sei ore nel coccio, come una volta.', p:'13 €', art:'pasta', o:{s:'#9c3a1f',n:'#f0c862'}, al:['glutine','uova','sedano'], nonna:true},
    {n:'Lasagne verdi al forno', d:'Sfoglia agli spinaci, ragù, besciamella e Parmigiano 30 mesi.', p:'14 €', art:'lasagna', al:['glutine','uova','latte','sedano']},
    {n:'Ribollita toscana', d:'Pane raffermo, cavolo nero, fagioli e un filo d\'olio nuovo.', p:'11 €', art:'zuppa', o:{c:'#8a5a2c',top:'fagioli'}, al:['glutine','sedano'], tags:['Vegana']},
    {n:'Risotto ai funghi', d:'Porcini e finferli del bosco, mantecato al burro di malga.', p:'15 €', art:'risotto', o:{c:'#e3cfa2',top:'funghi'}, al:['latte','sedano']}
  ]},
  {n:'Brace', ic:'🔥', s:'Carni cotte sul fuoco di legna di quercia', items:[
    {n:'Tagliata alla brace', d:'Manzo di razza romagnola, rosmarino e sale grosso.', p:'22 €', art:'tagliata', al:[]},
    {n:'Costine al miele', d:'Costine di maiale laccate al miele di castagno e pepe nero.', p:'16 €', art:'alette', al:['senape']}
  ]},
  {n:'Dolci', ic:'🥧', s:'Le ricette di famiglia', items:[
    {n:'Crostata di visciole', d:'Pasta frolla al burro e confettura di visciole fatta da noi.', p:'6 €', art:'torta', o:{c:'#8e1b3a'}, al:['glutine','uova','latte'], nonna:true},
    {n:'Zuppa inglese', d:'Pan di Spagna all\'alchermes, crema pasticcera e cioccolato.', p:'6 €', art:'tiramisu', al:['glutine','uova','latte']}
  ]},
  {n:'Cantina', ic:'🍷', s:'Vini delle colline di Romagna', items:[
    {n:'Sangiovese Superiore', d:'Rosso fruttato e speziato, perfetto con la brace. Al calice.', p:'5 €', art:'vino', al:['solfiti']},
    {n:'Albana secco', d:'Bianco minerale e agrumato. Al calice.', p:'5 €', art:'vino', o:{c:'#e8c35a'}, al:['solfiti']}
  ]}
];
var $ = function (s) { return document.querySelector(s); };
var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
var signs = $('#signs'), page = $('#page'), cur = -1;
signs.innerHTML = M.map(function (c, i) { return '<button class="sign" type="button" aria-pressed="false" data-i="' + i + '"><span><i aria-hidden="true">' + c.ic + '</i>' + c.n + '</span></button>'; }).join('');

function render(c) {
  var list = c.items.map(function (it) { it.cat = c.n; return it; });
  page.innerHTML = '<div class="stamp" aria-hidden="true">fatto<br>in casa</div><h2>' + c.n + '</h2><p class="sub">' + c.s + '</p>' +
    list.map(function (it, k) {
      return '<button class="dish" type="button" data-k="' + k + '"><span class="plate">' + Piatti.svg(it.art, it.o) + '</span><span class="tx"><span class="line"><b>' + it.n + '</b><span class="dots"></span><span class="pr">' + it.p + '</span></span><p>' + it.d + (it.nonna ? '<span class="nonna">ricetta della nonna</span>' : '') + '</p><span class="al" aria-label="Allergeni">' + Piatti.alIcons(it.al) + '</span></span></button>';
    }).join('');
  Array.prototype.forEach.call(page.querySelectorAll('.dish'), function (b) { b.addEventListener('click', function () { Piatti.modal(list, +b.getAttribute('data-k'), b); }); });
}
function show(i) {
  if (i === cur) return;
  var first = cur === -1; cur = i;
  Array.prototype.forEach.call(signs.children, function (b, k) { b.setAttribute('aria-pressed', k === i ? 'true' : 'false'); });
  if (first || reduced) { render(M[i]); return; }
  page.classList.remove('turn'); void page.offsetWidth; page.classList.add('turn');
  setTimeout(function () { render(M[i]); }, 340);
  var top = $('.book').getBoundingClientRect().top + scrollY - 110;
  if (scrollY > top) scrollTo({top: top, behavior: 'smooth'});
}
signs.addEventListener('click', function (e) { var b = e.target.closest('.sign'); if (b) { show(+b.getAttribute('data-i')); b.scrollIntoView({behavior: reduced ? 'auto' : 'smooth', inline: 'center', block: 'nearest'}); } });
show(0);
})();
</script>
<script src="assets/trial.js" data-model="Il Focolare" defer></script>
