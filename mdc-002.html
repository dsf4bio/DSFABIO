<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#e63b2e">
<title>Bella Napoli · Modello di menu digitale (esempio) | DSFabio Digital</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
:root{--red:#e63b2e;--red2:#c22c21;--green:#2f8f46;--cream:#fff8ef;--ink:#2a1b14;--sub:#7a6458;--line:#f0e1d2;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.5}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:10px}
.demo{background:var(--ink);color:#ffd9a8;text-align:center;font-size:.74rem;font-weight:800;padding:7px 12px}

/* Testata con tovaglia a quadri */
.top{position:relative;background:var(--red);color:#fff;text-align:center;padding:34px 20px 70px;overflow:hidden}
.top::before{content:"";position:absolute;inset:0;opacity:.18;background-image:linear-gradient(45deg,#fff 25%,transparent 25%,transparent 75%,#fff 75%),linear-gradient(45deg,#fff 25%,transparent 25%,transparent 75%,#fff 75%);background-size:36px 36px;background-position:0 0,18px 18px}
.top>*{position:relative}
.badge{display:inline-block;background:#fff;color:var(--red);font-family:Fredoka,sans-serif;font-weight:700;padding:6px 14px;border-radius:30px;font-size:.85rem;box-shadow:0 6px 0 rgba(0,0,0,.12)}
h1{font-family:Fredoka,sans-serif;font-size:clamp(2.8rem,12vw,4.6rem);line-height:1;margin:14px 0 6px;text-shadow:0 5px 0 var(--red2)}
.top p{font-weight:700;opacity:.95}
.pizza{font-size:4.6rem;line-height:1;margin-top:14px;display:inline-block;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Ricerca + categorie */
.tools{position:sticky;top:0;z-index:20;margin-top:-34px;padding:10px 14px 8px;background:linear-gradient(var(--cream) 70%,rgba(255,248,239,0))}
.tools-in{max-width:720px;margin:0 auto}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:0 14px;box-shadow:0 8px 24px rgba(42,27,20,.08);transition:border-color .2s}
.search:focus-within{border-color:var(--green)}
.search input{flex:1;border:0;background:none;padding:14px 0;font-size:1rem;outline:none;min-width:0}
.search .clr{font-size:1.2rem;color:var(--sub);padding:6px}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 0 4px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:9px 15px;border-radius:30px;background:#fff;border:2px solid var(--line);font-family:Fredoka,sans-serif;font-weight:600;transition:all .2s}
.cat.on{background:var(--green);border-color:var(--green);color:#fff;transform:translateY(-2px);box-shadow:0 4px 0 #1f6331}

main{max-width:720px;margin:0 auto;padding:6px 14px 30px}
.sec{padding-top:24px}
.sec h2{font-family:Fredoka,sans-serif;font-size:1.7rem;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec h2 small{font-family:Nunito,sans-serif;font-size:.85rem;color:var(--sub);font-weight:600}
.dish{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;transition:transform .2s,box-shadow .2s}
.dish:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(42,27,20,.08)}
.em{flex:0 0 64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:2.1rem;background:radial-gradient(circle at 35% 30%,#fff3df,#ffd9a8)}
.body{flex:1;min-width:0}
.body h3{font-family:Fredoka,sans-serif;font-size:1.18rem;line-height:1.2;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.body p{color:var(--sub);font-size:.9rem;margin-top:3px}
.price{font-family:Fredoka,sans-serif;font-weight:700;font-size:1.2rem;color:var(--red);white-space:nowrap}
.tag{font-family:Nunito,sans-serif;font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:20px}
.tag.veg{background:#e3f4e6;color:var(--green)}
.tag.hot{background:#ffe1dd;color:var(--red2)}
.tag.new{background:#fff0c7;color:#9a6a00}
.als{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.al{width:24px;height:24px;border-radius:8px;background:var(--cream);border:1px solid var(--line);display:inline-grid;place-items:center;font-size:.75rem}
.none{font-size:.72rem;color:var(--sub)}
mark{background:#fff0a8;color:inherit;border-radius:4px;padding:0 2px}
.empty{text-align:center;padding:40px 10px;color:var(--sub);font-weight:700}
.empty span{display:block;font-size:3rem;margin-bottom:6px}
.note{margin-top:22px;background:#fff;border:2px dashed var(--line);border-radius:20px;padding:16px;font-size:.9rem;color:var(--sub)}
.note b{color:var(--ink)}
.legend{margin-top:22px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:18px}
.legend h2{font-family:Fredoka,sans-serif;font-size:1.3rem;margin-bottom:10px}
.legend ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;font-size:.85rem}
.legend li{display:flex;gap:8px;align-items:center}
.legend p{font-size:.8rem;color:var(--sub);margin-top:10px}
footer{text-align:center;padding:30px 18px;color:var(--sub);font-size:.9rem}
footer strong{font-family:Fredoka,sans-serif;font-size:1.4rem;color:var(--ink);display:block}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.links a{text-decoration:none;padding:9px 14px;border-radius:30px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:.82rem;color:var(--ink)}
.pop{animation:pop .4s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.soc{display:flex;justify-content:center;gap:12px;margin:18px 0 6px}
.soc a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--soc-bg,#222);color:var(--soc-fg,#fff);transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s;text-decoration:none}
.soc a:hover{transform:translateY(-4px) scale(1.06);box-shadow:0 10px 22px rgba(0,0,0,.25)}
.soc a.fb{background:#1877F2;color:#fff}.soc a.wa{background:#25D366;color:#fff}
.soc a.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%);color:#fff}
.soc svg{width:23px;height:23px}
.flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-top:10px;font-size:.85rem}
.flinks a{text-decoration:underline;text-underline-offset:3px;color:inherit;opacity:.85}
</style>
</head>
<body>
<div class="demo">MODELLO DIMOSTRATIVO · piatti, prezzi e dati sono di fantasia</div>

<header class="top">
  <span class="badge">🇮🇹 Pizza napoletana · forno a legna</span>
  <h1>Bella Napoli</h1>
  <p>Impasto a 48 ore di lievitazione</p>
  <span class="pizza" aria-hidden="true">🍕</span>
</header>

<div class="tools">
  <div class="tools-in">
    <label class="search"><span aria-hidden="true">🔎</span><input id="q" type="search" aria-label="Cerca nel menu" placeholder="Cerca una pizza o un ingrediente…" autocomplete="off"><button class="clr" id="clr" aria-label="Cancella la ricerca" hidden>✕</button></label>
    <nav class="cats" id="cats" aria-label="Categorie"></nav>
  </div>
</div>

<main id="menu"></main>

<footer>
  <strong>Bella Napoli</strong>
  Piazza Dante 3 · Tel. 0123 456789<br><small>Dati di esempio</small>

</footer>


<script>
(function () {
'use strict';
/* ====== DATI DEL MENU: per un cliente cambi solo questa parte ====== */
var AL = {glutine:['🌾','Glutine'],crostacei:['🦐','Crostacei'],uova:['🥚','Uova'],pesce:['🐟','Pesce'],arachidi:['🥜','Arachidi'],soia:['🫘','Soia'],latte:['🥛','Latte'],frutta:['🌰','Frutta a guscio'],sedano:['🥬','Sedano'],senape:['🟡','Senape'],sesamo:['⚪','Sesamo'],solfiti:['🍷','Solfiti'],lupini:['🌼','Lupini'],molluschi:['🐚','Molluschi']};
var TAGS = {veg:'🌱 Veg', hot:'🌶 Piccante', new:'✨ Novità'};
var MENU = [
  {id:'classiche', t:'Le classiche', e:'🍕', items:[
    {n:'Margherita',d:'Pomodoro San Marzano, fiordilatte, basilico, olio EVO',p:6.5,a:['glutine','latte'],e:'🍕',t:['veg']},
    {n:'Marinara',d:'Pomodoro, aglio, origano, olio EVO',p:5.5,a:['glutine'],e:'🍅',t:['veg']},
    {n:'Diavola',d:'Pomodoro, fiordilatte, salame piccante',p:8,a:['glutine','latte'],e:'🌶️',t:['hot']},
    {n:'Capricciosa',d:'Pomodoro, fiordilatte, prosciutto cotto, funghi, carciofi, olive',p:9,a:['glutine','latte'],e:'🍄'},
    {n:'Quattro formaggi',d:'Fiordilatte, gorgonzola, provola, parmigiano',p:9,a:['glutine','latte'],e:'🧀',t:['veg']},
    {n:'Napoli',d:'Pomodoro, fiordilatte, alici, capperi, origano',p:8,a:['glutine','latte','pesce'],e:'🐟'},
    {n:'Prosciutto e funghi',d:'Pomodoro, fiordilatte, prosciutto cotto, champignon',p:8.5,a:['glutine','latte'],e:'🍄'}]},
  {id:'speciali', t:'Le speciali', e:'⭐', items:[
    {n:'Bella Napoli',d:'Bufala DOP, pomodorini del piennolo, basilico, scaglie di parmigiano',p:11,a:['glutine','latte'],e:'⭐',t:['new']},
    {n:'Salsiccia e friarielli',d:'Fiordilatte affumicato, salsiccia, friarielli',p:10,a:['glutine','latte'],e:'🥬'},
    {n:'Mortadella e pistacchio',d:'Fiordilatte, mortadella, granella e crema di pistacchio',p:11,a:['glutine','latte','frutta'],e:'🥜'},
    {n:'Genovese',d:'Fiordilatte, ragù di cipolle alla genovese, pecorino',p:11,a:['glutine','latte','sedano'],e:'🧅'},
    {n:'Nduja e burrata',d:'Pomodoro, nduja calabrese, burrata a crudo',p:12,a:['glutine','latte'],e:'🔥',t:['hot']},
    {n:'Ortolana',d:'Fiordilatte, zucchine, melanzane, peperoni grigliati',p:9.5,a:['glutine','latte'],e:'🫑',t:['veg']}]},
  {id:'bianche', t:'Le bianche', e:'🤍', items:[
    {n:'Patate e provola',d:'Provola affumicata, patate al forno, rosmarino',p:9,a:['glutine','latte'],e:'🥔',t:['veg']},
    {n:'Crudo e rucola',d:'Fiordilatte, crudo di Parma, rucola, grana',p:10,a:['glutine','latte'],e:'🥗'},
    {n:'Tonno e cipolla',d:'Fiordilatte, tonno, cipolla rossa di Tropea',p:9,a:['glutine','latte','pesce'],e:'🧅'},
    {n:'Zucca e salsiccia',d:'Crema di zucca, fiordilatte, salsiccia, salvia',p:10,a:['glutine','latte'],e:'🎃',t:['new']}]},
  {id:'fritti', t:'Fritti', e:'🍟', items:[
    {n:'Montanara',d:'Pizza fritta con pomodoro e parmigiano',p:5,a:['glutine','latte'],e:'🫓',t:['veg']},
    {n:'Frittatina di pasta',d:'Bucatini, besciamella, piselli, prosciutto',p:3.5,a:['glutine','latte','uova'],e:'🍝'},
    {n:'Crocchè di patate',d:'Patate, provola, prezzemolo (3 pezzi)',p:4,a:['glutine','latte','uova'],e:'🥔',t:['veg']},
    {n:'Arancino al ragù',d:'Riso, ragù di carne, piselli, mozzarella',p:4,a:['glutine','latte','uova','sedano'],e:'🍙'},
    {n:'Patatine fritte',d:'Porzione abbondante',p:4,a:[],e:'🍟',t:['veg']}]},
  {id:'dolci', t:'Dolci', e:'🍰', items:[
    {n:'Babà al rum',d:'Con crema pasticcera e amarene',p:5,a:['glutine','uova','latte'],e:'🧁'},
    {n:'Pizza alla Nutella',d:'Da dividere in due',p:7,a:['glutine','latte','frutta'],e:'🍫'},
    {n:'Sfogliatella riccia',d:'Calda, con ricotta e canditi',p:3,a:['glutine','uova','latte'],e:'🥐'}]},
  {id:'bevande', t:'Bevande', e:'🥤', items:[
    {n:'Birra artigianale',d:'Bionda 0,4 l',p:5,a:['glutine'],e:'🍺'},
    {n:'Birra alla spina',d:'Media 0,4 l',p:4.5,a:['glutine'],e:'🍻'},
    {n:'Bibite in lattina',d:'Cola, aranciata, gassosa',p:3,a:[],e:'🥤'},
    {n:'Vino della casa',d:'Rosso o bianco, 1/4 l',p:4,a:['solfiti'],e:'🍷'},
    {n:'Acqua',d:'Naturale o frizzante 0,5 l',p:1.5,a:[],e:'💧'},
    {n:'Caffè',d:'Espresso napoletano',p:1.3,a:[],e:'☕'}]}
];
var NOTE = '<b>Impasto senza glutine?</b> Disponibile su richiesta (+2 €). Chiedi al personale.';
/* ================================================================== */
var eur = function (v) { return new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR'}).format(v); };
var $ = function (s) { return document.querySelector(s); };
var norm = function (s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); };
var esc = function (s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); };
function hl(text, q) { if (!q) return text; var re = new RegExp('(' + esc(q) + ')', 'ig'); return text.replace(re, '<mark>$1</mark>'); }
function als(a) { return a.length ? a.map(function (k) { return '<span class="al" title="' + AL[k][1] + '" aria-label="' + AL[k][1] + '">' + AL[k][0] + '</span>'; }).join('') : '<span class="none">Nessun allergene dichiarato</span>'; }
var cur = MENU[0].id, q = '';
var catsEl = $('#cats'), menu = $('#menu'), input = $('#q'), clr = $('#clr');
function render() {
  var nq = norm(q.trim()), out = '', found = 0;
  var list = nq ? MENU : MENU.filter(function (c) { return c.id === cur; });
  list.forEach(function (c) {
    var items = c.items.filter(function (it) { return !nq || norm(it.n + ' ' + it.d).indexOf(nq) > -1; });
    if (!items.length) return;
    found += items.length;
    out += '<section class="sec" aria-labelledby="h-' + c.id + '"><h2 id="h-' + c.id + '">' + c.e + ' ' + c.t + ' <small>' + items.length + ' proposte</small></h2>';
    items.forEach(function (it, i) {
      out += '<article class="dish pop" style="animation-delay:' + (i * 50) + 'ms"><div class="em" aria-hidden="true">' + it.e + '</div><div class="body"><h3>' + hl(it.n, q.trim()) + (it.t || []).map(function (k) { return ' <span class="tag ' + k + '">' + TAGS[k] + '</span>'; }).join('') + '</h3><p>' + hl(it.d, q.trim()) + '</p><div class="als">' + als(it.a) + '</div></div><span class="price">' + eur(it.p) + '</span></article>';
    });
    out += '</section>';
  });
  if (!found) out = '<div class="empty"><span aria-hidden="true">🤔</span>Nessun piatto trovato per “' + q.replace(/</g, '&lt;') + '”</div>';
  out += '<div class="note">' + NOTE + '</div>';
  out += '<section class="legend" aria-labelledby="leg"><h2 id="leg">Legenda allergeni</h2><ul>' + Object.keys(AL).map(function (k) { return '<li><span class="al">' + AL[k][0] + '</span>' + AL[k][1] + '</li>'; }).join('') + '</ul><p>Per informazioni su allergeni e intolleranze chiedi al personale. I piatti possono contenere tracce di altri allergeni.</p></section>';
  menu.innerHTML = out;
  catsEl.querySelectorAll('.cat').forEach(function (b) { b.classList.toggle('on', !nq && b.dataset.id === cur); b.setAttribute('aria-pressed', !nq && b.dataset.id === cur); });
}
catsEl.innerHTML = MENU.map(function (c) { return '<button class="cat" data-id="' + c.id + '">' + c.e + ' ' + c.t + '</button>'; }).join('');
catsEl.addEventListener('click', function (e) {
  var b = e.target.closest('.cat'); if (!b) return;
  cur = b.dataset.id; q = ''; input.value = ''; clr.hidden = true; render();
  b.scrollIntoView({inline: 'center', block: 'nearest', behavior: 'smooth'});
});
input.addEventListener('input', function () { q = input.value; clr.hidden = !q; render(); });
clr.addEventListener('click', function () { q = ''; input.value = ''; clr.hidden = true; render(); input.focus(); });
render();
})();
</script>
