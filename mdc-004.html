<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#16171b">
<title>Bistrot Urbano · Modello di menu digitale (esempio) | DSFabio Digital</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@700&display=swap">
<style>
:root{--bg:#16171b;--panel:#1f2026;--panel2:#272830;--txt:#f1ede4;--sub:#a29d92;--mus:#f2b134;--line:#33343c;--soc-bg:#272830}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:"Space Grotesk",system-ui,sans-serif;line-height:1.5}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--mus);outline-offset:3px;border-radius:6px}
.demo{background:var(--mus);color:#16171b;text-align:center;font-size:.74rem;font-weight:700;padding:7px 12px}
.mono{font-family:"Space Mono",monospace}

.top{max-width:760px;margin:0 auto;padding:34px 20px 22px}
.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top h1{font-size:clamp(2.8rem,13vw,5rem);line-height:.88;letter-spacing:-.04em;font-weight:700;text-transform:uppercase}
.top h1 span{color:var(--mus)}
.stamp{flex:0 0 auto;width:84px;height:84px;border-radius:50%;border:2px dashed var(--mus);display:grid;place-items:center;text-align:center;font-size:.6rem;line-height:1.2;color:var(--mus);animation:rot 20s linear infinite;text-transform:uppercase}
@keyframes rot{to{transform:rotate(360deg)}}
.addr{color:var(--sub);margin-top:14px;font-size:.92rem}

/* Ora in servizio */
.now{max-width:760px;margin:0 auto;padding:0 20px}
.now-box{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--mus);border-radius:10px;padding:14px 16px}
.dot{width:10px;height:10px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:pulse 1.8s infinite;flex:0 0 auto}
.dot.off{background:#e05656;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.now-box b{display:block}
.now-box small{color:var(--sub)}

main{max-width:760px;margin:0 auto;padding:18px 20px 30px}
.acc{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.acc-h{width:100%;display:flex;align-items:center;gap:14px;padding:18px 16px;text-align:left}
.acc-h .ix{font-family:"Space Mono",monospace;color:var(--mus);font-size:.9rem}
.acc-h .tt{flex:1}
.acc-h .tt b{display:block;font-size:1.35rem;text-transform:uppercase;letter-spacing:-.01em;line-height:1.1}
.acc-h .tt small{color:var(--sub);font-size:.82rem}
.live{font-size:.66rem;font-weight:700;text-transform:uppercase;background:var(--mus);color:#16171b;padding:3px 8px;border-radius:4px;margin-left:6px;vertical-align:3px}
.chev{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .35s,background .35s}
.acc.open .chev{transform:rotate(45deg);background:var(--mus);color:#16171b;border-color:var(--mus)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.9,.2,1)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden}
.it{display:grid;grid-template-columns:1fr auto;gap:4px 14px;padding:14px 16px;border-top:1px solid var(--line)}
.it h3{font-size:1.05rem;font-weight:700}
.it .p{font-family:"Space Mono",monospace;color:var(--mus);font-size:1rem;white-space:nowrap}
.it p{grid-column:1/-1;color:var(--sub);font-size:.88rem}
.it .als{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.al{width:24px;height:24px;border-radius:6px;background:var(--panel2);display:inline-grid;place-items:center;font-size:.72rem}
.none{font-size:.72rem;color:var(--sub)}
.tag{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--mus);color:var(--mus);padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:2px}
.legend{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.legend h2{font-size:1.1rem;text-transform:uppercase;margin-bottom:10px}
.legend ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;font-size:.85rem}
.legend li{display:flex;gap:8px;align-items:center}
.legend p{font-size:.8rem;color:var(--sub);margin-top:10px}
footer{text-align:center;padding:30px 18px;color:var(--sub);font-size:.9rem}
footer strong{font-size:1.4rem;text-transform:uppercase;color:var(--txt);display:block}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.links a{text-decoration:none;padding:9px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:.82rem;color:var(--txt)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.soc{display:flex;justify-content:center;gap:12px;margin:18px 0 6px}
.soc a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--soc-bg,#222);color:var(--soc-fg,#fff);transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s;text-decoration:none}
.soc a:hover{transform:translateY(-4px) scale(1.06);box-shadow:0 10px 22px rgba(0,0,0,.25)}
.soc a.fb{background:#1877F2;color:#fff}.soc a.wa{background:#25D366;color:#fff}
.soc a.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%);color:#fff}
.soc svg{width:23px;height:23px}
.flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-top:10px;font-size:.85rem}
.flinks a{text-decoration:underline;text-underline-offset:3px;color:inherit;opacity:.85}
</style>
</head>
<body>
<div class="demo">MODELLO DIMOSTRATIVO · piatti, prezzi e dati sono di fantasia</div>

<header class="top">
  <div class="brand">
    <h1>Bistrot<br><span>Urbano</span></h1>
    <div class="stamp mono" aria-hidden="true">caffè<br>cucina<br>cocktail</div>

</header>

<div class="now"><div class="now-box" role="status"><span class="dot" id="dot"></span><div><b id="now-t"></b><small id="now-s"></small></div></div></div>

<main id="menu"></main>

<footer>
  <strong>Bistrot Urbano</strong>

</footer>


<script>
(function () {
'use strict';
/* ====== DATI DEL MENU: per un cliente cambi solo questa parte ======
   da / a = orario in cui la sezione è "in servizio" (ore, 0-24) */
var AL = {glutine:['🌾','Glutine'],crostacei:['🦐','Crostacei'],uova:['🥚','Uova'],pesce:['🐟','Pesce'],arachidi:['🥜','Arachidi'],soia:['🫘','Soia'],latte:['🥛','Latte'],frutta:['🌰','Frutta a guscio'],sedano:['🥬','Sedano'],senape:['🟡','Senape'],sesamo:['⚪','Sesamo'],solfiti:['🍷','Solfiti'],lupini:['🌼','Lupini'],molluschi:['🐚','Molluschi']};
var MENU = [
  {id:'colazione', t:'Colazione', da:7, a:11.5, items:[
    {n:'Cornetto artigianale',d:'Vuoto, crema, marmellata o pistacchio',p:1.6,a:['glutine','uova','latte']},
    {n:'Cappuccino',d:'Anche con latte d\'avena',p:1.8,a:['latte']},
    {n:'Toast avocado e uovo',d:'Pane di segale, avocado, uovo strapazzato, lime',p:8,a:['glutine','uova'],t:'Top'},
    {n:'Yogurt bowl',d:'Yogurt greco, granola, frutti di bosco, miele',p:6.5,a:['latte','glutine','frutta']},
    {n:'Pancake stack',d:'Tre pancake, sciroppo d\'acero, burro salato',p:8,a:['glutine','uova','latte']},
    {n:'Spremuta d\'arancia',d:'Arance di Sicilia, spremute al momento',p:4,a:[]}]},
  {id:'pranzo', t:'Pranzo', da:12, a:15, items:[
    {n:'Club sandwich',d:'Pollo, bacon croccante, lattuga, pomodoro, maionese',p:11,a:['glutine','uova','senape']},
    {n:'Poke di salmone',d:'Riso sushi, salmone, edamame, mango, sesamo',p:13,a:['pesce','soia','sesamo']},
    {n:'Insalata urbana',d:'Misticanza, pere, noci, gorgonzola, miele',p:10,a:['latte','frutta'],t:'Veg'},
    {n:'Pasta del giorno',d:'Chiedi al banco la proposta di oggi',p:10,a:['glutine']},
    {n:'Burger urbano',d:'Manzo 180 g, cheddar, cipolla caramellata, patate',p:14,a:['glutine','latte','senape','sesamo'],t:'Top'},
    {n:'Vellutata di stagione',d:'Con crostini e olio al rosmarino',p:8,a:['glutine','sedano'],t:'Veg'}]},
  {id:'aperitivo', t:'Aperitivo', da:17.5, a:21, items:[
    {n:'Spritz',d:'Aperol o Campari, prosecco, soda',p:6,a:['solfiti']},
    {n:'Negroni',d:'Gin, vermouth rosso, bitter',p:8,a:['solfiti']},
    {n:'Gin tonic',d:'Gin italiano, tonica premium, cetriolo',p:9,a:[]},
    {n:'Calice di vino',d:'Bianco, rosso o bollicine della settimana',p:6,a:['solfiti']},
    {n:'Tagliere urbano',d:'Salumi, formaggi, focaccia, giardiniera',p:14,a:['glutine','latte','solfiti'],t:'Per 2'},
    {n:'Patatine e olive',d:'Il classico che non manca mai',p:4,a:[]}]},
  {id:'dopocena', t:'Dopocena', da:21, a:23, items:[
    {n:'Espresso Martini',d:'Vodka, caffè espresso, liquore al caffè',p:9,a:[]},
    {n:'Old Fashioned',d:'Bourbon, zucchero, angostura, scorza d\'arancia',p:10,a:[]},
    {n:'Amaro della casa',d:'Ricetta alle erbe, servito con ghiaccio',p:5,a:[]},
    {n:'Mocktail di stagione',d:'Analcolico, chiedi la proposta del barman',p:6,a:[],t:'0%'}]},
  {id:'sempre', t:'Sempre disponibili', da:7, a:23, items:[
    {n:'Acqua',d:'Naturale o frizzante 0,5 l',p:1.5,a:[]},
    {n:'Caffè espresso',d:'Miscela della casa',p:1.3,a:[]},
    {n:'Bibite',d:'Cola, aranciata, chinotto, tè freddo',p:3.5,a:[]},
    {n:'Cheesecake del giorno',d:'Chiedi il gusto al bancone',p:5,a:['glutine','uova','latte']},
    {n:'Brownie al cioccolato',d:'Caldo, con gelato alla vaniglia',p:5.5,a:['glutine','uova','latte','frutta']}]}
];
/* ================================================================== */
var eur = function (v) { return new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR'}).format(v); };
var $ = function (s) { return document.querySelector(s); };
var hm = function (h) { return Math.floor(h) + ':' + (h % 1 ? '30' : '00'); };
var d = new Date(), now = d.getHours() + d.getMinutes() / 60;
var inService = function (c) { return now >= c.da && now < c.a; };
var live = MENU.filter(function (c) { return inService(c) && c.id !== 'sempre'; })[0];
function als(a) { return a.length ? a.map(function (k) { return '<span class="al" title="' + AL[k][1] + '" aria-label="' + AL[k][1] + '">' + AL[k][0] + '</span>'; }).join('') : '<span class="none">Nessun allergene dichiarato</span>'; }
var html = '';
MENU.forEach(function (c, i) {
  var open = live ? c.id === live.id : i === 0;
  html += '<section class="acc' + (open ? ' open' : '') + '" id="' + c.id + '"><h2 style="font-size:inherit"><button class="acc-h" aria-expanded="' + open + '" aria-controls="b-' + c.id + '"><span class="ix" aria-hidden="true">' + String(i + 1).padStart(2, '0') + '</span><span class="tt"><b>' + c.t + (live && c.id === live.id ? '<span class="live">ora</span>' : '') + '</b><small>' + hm(c.da) + ' – ' + hm(c.a) + ' · ' + c.items.length + ' proposte</small></span><span class="chev" aria-hidden="true">+</span></button></h2><div class="acc-b" id="b-' + c.id + '"><div>';
  c.items.forEach(function (it) {
    html += '<article class="it"><h3>' + it.n + (it.t ? '<span class="tag">' + it.t + '</span>' : '') + '</h3><span class="p">' + eur(it.p) + '</span><p>' + it.d + '</p><div class="als">' + als(it.a) + '</div></article>';
  });
  html += '</div></div></section>';
});
html += '<section class="legend" aria-labelledby="leg"><h2 id="leg">Legenda allergeni</h2><ul>' + Object.keys(AL).map(function (k) { return '<li><span class="al">' + AL[k][0] + '</span>' + AL[k][1] + '</li>'; }).join('') + '</ul><p>Per informazioni su allergeni e intolleranze chiedi al personale. I piatti possono contenere tracce di altri allergeni.</p></section>';
$('#menu').innerHTML = html;
document.querySelectorAll('.acc-h').forEach(function (b) {
  b.addEventListener('click', function () {
    var s = b.closest('.acc'), o = s.classList.toggle('open'); b.setAttribute('aria-expanded', o);
  });
});
if (live) { $('#now-t').textContent = 'Ora serviamo: ' + live.t; $('#now-s').textContent = 'Fino alle ' + hm(live.a) + ' · trovi la sezione già aperta qui sotto'; }
else if (now >= 7 && now < 23) { $('#now-t').textContent = 'Siamo aperti'; $('#now-s').textContent = 'Bar e proposte sempre disponibili'; }
else { $('#dot').classList.add('off'); $('#now-t').textContent = 'Al momento siamo chiusi'; $('#now-s').textContent = 'Riapriamo alle 7:00 · sfoglia pure il menu'; }
})();
</script>
<script src="assets/trial.js" data-model="Bistrot Urbano" defer></script>
</body>
