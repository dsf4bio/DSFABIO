<style>
:root{--bg:#f6f1e7;--paper:#fffdf8;--ink:#1d1a16;--sub:#6d655a;--gold:#b08d57;--gold2:#8a6a3c;--line:#e4dccd;--soc-bg:#1d1a16}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.55}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.demo{background:var(--ink);color:#e9d9b8;text-align:center;font-size:.74rem;font-weight:700;letter-spacing:.06em;padding:7px 12px}

/* Hero */
.hero{position:relative;text-align:center;padding:64px 22px 54px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:16px;border:1px solid var(--line);border-radius:4px;pointer-events:none}
.hero::after{content:"";position:absolute;inset:22px;border:1px solid var(--line);border-radius:2px;pointer-events:none}
.mono{width:74px;height:74px;margin:0 auto 18px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-size:2rem;color:var(--gold2)}
.kick{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);font-weight:700}
h1{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:clamp(3rem,13vw,5.6rem);line-height:.95;margin:10px 0 8px}
.hero p{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.25rem;color:var(--sub)}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:22px auto 0;color:var(--gold)}
.orn::before,.orn::after{content:"";width:60px;height:1px;background:var(--gold)}

/* Nav categorie */
.nav{position:sticky;top:0;z-index:20;background:rgba(246,241,231,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-block:1px solid var(--line)}
.nav-in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:760px;margin:0 auto;padding:0 10px}
.nav-in::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;position:relative;padding:16px 14px;text-decoration:none;font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--sub);transition:color .3s}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:10px;height:1px;background:var(--gold);transform:scaleX(0);transition:transform .4s}
.nav a.on{color:var(--ink)}
.nav a.on::after{transform:scaleX(1)}

/* Sezioni */
main{max-width:760px;margin:0 auto;padding:10px 22px 40px}
.sec{padding:46px 0 10px}
.sec-h{text-align:center;margin-bottom:26px}
.sec-h h2{font-family:"Cormorant Garamond",serif;font-size:2.4rem;font-weight:700;line-height:1}
.sec-h span{display:block;font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--sub);font-size:1.1rem;margin-top:6px}
.item{padding:16px 0;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:baseline;gap:10px}
.row h3{font-family:"Cormorant Garamond",serif;font-size:1.4rem;font-weight:700;line-height:1.15}
.dots{flex:1;border-bottom:1px dotted #c7b99f;transform:translateY(-5px);min-width:20px}
.price{font-family:"Cormorant Garamond",serif;font-size:1.35rem;font-weight:700;color:var(--gold2);white-space:nowrap}
.desc{font-style:italic;font-family:"Cormorant Garamond",serif;font-size:1.08rem;color:var(--sub);margin-top:2px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.al{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:inline-grid;place-items:center;font-size:.72rem}
.tag{font-size:.64rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--gold);color:var(--gold2);border-radius:20px}
.none{font-size:.72rem;color:var(--sub)}

/* Degustazione */
.tasting{margin:40px 0 10px;background:var(--ink);color:#f3eadb;border-radius:6px;padding:34px 26px;text-align:center;position:relative}
.tasting::before{content:"";position:absolute;inset:8px;border:1px solid rgba(176,141,87,.5);border-radius:3px;pointer-events:none}
.tasting h2{font-family:"Cormorant Garamond",serif;font-size:2.2rem;line-height:1}
.tasting .kick{color:#d7bd8a}
.tasting ol{list-style:none;margin:18px 0;display:grid;gap:6px;font-family:"Cormorant Garamond",serif;font-size:1.2rem;font-style:italic}
.tasting .p{font-family:"Cormorant Garamond",serif;font-size:1.8rem;color:#e6cb95}
.tasting small{display:block;color:#bfb29c;font-size:.8rem;margin-top:4px}

/* Legenda + footer */
.legend{margin-top:46px;padding:22px;background:var(--paper);border:1px solid var(--line);border-radius:6px}
.legend h2{font-family:"Cormorant Garamond",serif;font-size:1.6rem;margin-bottom:12px}
.legend ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;font-size:.85rem}
.legend li{display:flex;align-items:center;gap:8px}
.legend p{margin-top:12px;font-size:.8rem;color:var(--sub)}
footer{text-align:center;padding:40px 20px 30px;color:var(--sub);font-size:.88rem}
footer strong{font-family:"Cormorant Garamond",serif;font-size:1.5rem;color:var(--ink);display:block}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.links a{text-decoration:none;padding:9px 14px;border:1px solid var(--line);border-radius:30px;background:var(--paper);font-weight:600;font-size:.82rem;color:var(--ink)}


/* Comparsa */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none;transition:none}}
.soc{display:flex;justify-content:center;gap:12px;margin:18px 0 6px}
.soc a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--soc-bg,#222);color:var(--soc-fg,#fff);transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s;text-decoration:none}
.soc a:hover{transform:translateY(-4px) scale(1.06);box-shadow:0 10px 22px rgba(0,0,0,.25)}
.soc a.fb{background:#1877F2;color:#fff}.soc a.wa{background:#25D366;color:#fff}
.soc a.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%);color:#fff}
.soc svg{width:23px;height:23px}
.flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-top:10px;font-size:.85rem}
.flinks a{text-decoration:underline;text-underline-offset:3px;color:inherit;opacity:.85}
</style>

function setOn(id) {
